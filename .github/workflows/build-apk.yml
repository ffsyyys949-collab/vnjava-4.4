name: Build VNJAVA Native APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Web Bundle for Offline APK
        run: |
          npm install --legacy-peer-deps
          npm run build
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/. android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/assets/aistudio/Screenshot_20261120_122542_58042277.jpg android/app/src/main/assets/www/assets/aistudio/Screenshot_20261120_123738_e3422872.jpg android/app/src/main/assets/www/assets/aistudio/Screenshot_20261120_125334_4e614367.jpg

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK 34
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Native Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK output
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VNJAVA.apk

      - name: Upload VNJAVA.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VNJAVA.apk
          path: VNJAVA.apk
          retention-days: 30
